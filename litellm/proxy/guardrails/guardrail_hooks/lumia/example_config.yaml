# Example configuration for the Lumia Security guardrail.
#
# The Lumia guardrail forwards every request and response to a Lumia inspection
# endpoint. Lumia decides whether the call should be allowed, blocked, or
# modified based on the customer's tenant policies. The guardrail preserves the
# natural LiteLLM request structure so multi-modal content (images, files, tool
# calls) is passed through unchanged.

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

guardrails:
  - guardrail_name: "lumia-guardrail"
    litellm_params:
      guardrail: lumia
      mode: ["pre_call", "post_call"]
      api_base: https://guardrails.lumia.security      # Lumia guardrail endpoint
      api_key: os.environ/LUMIA_GUARDRAIL_API_KEY      # Tenant token from Lumia
      default_on: true                                  # Run on every request
      timeout: 5                                        # HTTP timeout in seconds
      unreachable_fallback: fail_open                   # fail_open | fail_closed
